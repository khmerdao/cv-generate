x-php-env: &php-env
  DATABASE_URL: "mysql://app:app@mysql:3306/app?serverVersion=8.0&charset=utf8mb4"
  REDIS_URL: "redis://redis:6379"
  MESSENGER_TRANSPORT_DSN: "redis://redis:6379/messages"
  MAILER_DSN: "smtp://mailpit:1025"
  MERCURE_URL: "http://mercure/.well-known/mercure"
  MERCURE_PUBLIC_URL: "http://localhost:3000/.well-known/mercure"
  MERCURE_JWT_SECRET: "!ChangeThisMercureHubJWTSecretKey!"
  GOTENBERG_URL: "http://gotenberg:3000"

services:
  php:
    build: { context: ., dockerfile: docker/php/Dockerfile, target: dev }
    volumes: [ ".:/app" ]
    depends_on: [ mysql, redis ]
    environment: *php-env

  worker:
    build: { context: ., dockerfile: docker/php/Dockerfile, target: dev }
    # messenger is wired in Task 13; until then the worker waits instead of crash-looping.
    command:
      - sh
      - -c
      - >
        until php bin/console list messenger >/dev/null 2>&1; do
          echo "worker: waiting for symfony/messenger (Task 13)"; sleep 15;
        done;
        exec php bin/console messenger:consume async --time-limit=3600 -vv
    volumes: [ ".:/app" ]
    depends_on: [ php ]
    environment: *php-env
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports: [ "8080:80" ]
    volumes:
      - ".:/app:ro"
      - "./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"
    depends_on: [ php ]
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: app, MYSQL_USER: app, MYSQL_PASSWORD: app }
    volumes: [ "mysql_data:/var/lib/mysql" ]
    ports: [ "3307:3306" ]

  redis:
    image: redis:7-alpine

  mercure:
    image: dunglas/mercure
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: "!ChangeThisMercureHubJWTSecretKey!"
      MERCURE_SUBSCRIBER_JWT_KEY: "!ChangeThisMercureHubJWTSecretKey!"
      MERCURE_EXTRA_DIRECTIVES: "cors_origins http://localhost:8080"
    ports: [ "3000:80" ]

  gotenberg:
    image: gotenberg/gotenberg:8

  mailpit:
    image: axllent/mailpit
    ports: [ "8025:8025" ]

volumes:
  mysql_data:
