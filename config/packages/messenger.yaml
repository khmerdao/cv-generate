framework:
    messenger:
        failure_transport: failed
        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    stream: cvtailor
                    group: workers
                retry_strategy:
                    max_retries: 0
            failed: 'doctrine://default?queue_name=failed'
        routing:
            'App\Shared\Message\PingMessage': async
            'Symfony\Component\Mailer\Messenger\SendEmailMessage': async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'
